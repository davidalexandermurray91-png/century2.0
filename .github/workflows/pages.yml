# Publishes the game to GitHub Pages on every push.
#
# `enablement: true` asks GitHub to switch Pages on for this repository if it
# isn't already, which saves doing it by hand in the repo settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/survival-game-design-jgal21]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # the whole repo is the site — no build step to run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
